<!DOCTYPE html>
<html lang="en" class="h-full bg-white text-black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimuLab - Physics Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="min-h-full flex flex-col font-sans antialiased bg-white text-black p-4 sm:p-8">

  <div class="max-w-md mx-auto w-full mb-6 flex items-center justify-between">
    <a href="../index.html" class="text-xs font-semibold text-gray-600 hover:text-black flex items-center gap-2">
      <i class="fa-solid fa-arrow-left"></i> Back to Hub
    </a>
    <span class="text-xs font-mono text-pink-600 bg-pink-100 px-2.5 py-1 rounded-md border border-pink-200">Developer 2 Sandbox</span>
  </div>

  <main class="max-w-md mx-auto w-full flex-1 flex items-center justify-center">
    <div class="bg-white rounded-3xl border border-gray-200 p-8 shadow-2xl relative overflow-hidden w-full">
      <div class="absolute top-0 right-0 w-32 h-32 bg-pink-200/60 rounded-full blur-2xl pointer-events-none"></div>
      <div class="absolute top-5 left-5 w-3 h-3 rounded-full bg-pink-300 pointer-events-none"></div>
      
      <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-2xl bg-pink-100 text-pink-600 flex items-center justify-center text-2xl mx-auto mb-4 border border-pink-200">
          <i class="fa-solid fa-atom"></i>
        </div>
        <h2 class="text-2xl font-bold text-black">Physics Login</h2>
        <p class="text-gray-600 text-sm mt-1">Enter your student credentials or quick join code</p>
      </div>

      <form class="space-y-5" onsubmit="event.preventDefault();">
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Student ID or Email</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500">
              <i class="fa-solid fa-id-card"></i>
            </span>
            <input type="text" placeholder="e.g. S-10492 or student@school.edu" required class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm text-black placeholder-gray-400 focus:outline-none focus:border-pink-300 focus:ring-1 focus:ring-pink-300 transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Class Code</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500">
              <i class="fa-solid fa-key"></i>
            </span>
            <input type="text" placeholder="e.g. SIM-2026-X" required class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm text-black placeholder-gray-400 focus:outline-none focus:border-pink-300 focus:ring-1 focus:ring-pink-300 transition-all font-mono uppercase">
          </div>
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            required
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-base text-slate-800 placeholder-slate-400 transition-all duration-200 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" placeholder="••••••••" required class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm text-black placeholder-gray-400 focus:outline-none focus:border-pink-300 focus:ring-1 focus:ring-pink-300 transition-all">
          </div>
        </div>

        <button type="submit" class="w-full py-3.5 bg-pink-300 hover:bg-pink-400 text-black font-semibold rounded-xl transition-all shadow-lg shadow-pink-300/30 flex items-center justify-center gap-2">
          <span>Sign In to Simulation</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="mt-6 text-center pt-6 border-t border-gray-200">
        <p class="text-xs text-gray-500">
          Are you an instructor? 
          <a href="teacherlogin.html" class="text-pink-600 hover:underline font-semibold ml-1">Go to Teacher Login</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
