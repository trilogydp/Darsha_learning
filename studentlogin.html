<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimuLab - Student Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="min-h-full flex flex-col font-sans antialiased bg-slate-900 text-slate-100 justify-center items-center px-4">

    <div class="max-w-md w-full mb-6 flex items-center justify-between">
        <a href="./landinghome.html" class="text-xs font-semibold text-slate-400 hover:text-white flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
        <span class="text-xs font-mono text-blue-400 bg-blue-500/10 px-2.5 py-1 rounded-md">Student Workspace</span>
    </div>

    <main class="max-w-md w-full bg-slate-800 border border-slate-700/50 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl pointer-events-none"></div>
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-2xl">
                <i class="fa-solid fa-user-graduate"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Student Portal Login</h2>
            <p class="text-sm text-slate-400 mt-1">Enter your details to access your simulation files</p>
        </div>

        <form class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Student ID</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                        <i class="fa-solid fa-id-card"></i>
                    </span>
                    <input type="text" placeholder="e.g. STU12345" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition-colors">
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-blue-600/20 transition-all text-sm mt-2">
                Sign In
            </button>
        </form>
    </main>

</body>
</html>
