<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimuLab - Student Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-sky-100 via-white to-blue-50 p-6 font-sans antialiased text-slate-800">
  <div class="w-full max-w-md">
    <div class="rounded-3xl border border-blue-100 bg-white p-8 shadow-[0_24px_70px_rgba(37,99,235,0.12)] ring-1 ring-blue-50">
      <div class="mb-8 text-center">
        <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-600 text-2xl text-white shadow-lg shadow-blue-600/20">
          <i class="fa-solid fa-user-graduate"></i>
        </div>
        <h1 class="text-3xl font-bold text-slate-900">Welcome back</h1>
        <p class="mt-2 text-sm text-slate-500">Sign in to continue to your dashboard</p>
      </div>

      <form class="space-y-5" onsubmit="event.preventDefault();">
        <div>
          <label for="username" class="mb-2 block text-sm font-semibold text-slate-700">Username</label>
          <input
            id="username"
            type="text"
            placeholder="Enter your username"
            required
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-base text-slate-800 placeholder-slate-400 transition-all duration-200 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100"
          >
        </div>

        <div>
          <div class="mb-2 flex items-center justify-between">
            <label for="password" class="block text-sm font-semibold text-slate-700">Password</label>
            <a href="#" class="text-sm font-medium text-blue-600 transition hover:text-blue-700">Forgot?</a>
          </div>
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            required
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-base text-slate-800 placeholder-slate-400 transition-all duration-200 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100"
          >
        </div>

        <button
          type="submit"
          class="w-full rounded-xl bg-blue-600 px-4 py-3.5 text-base font-semibold text-white shadow-lg shadow-blue-600/25 transition-all duration-200 hover:bg-blue-500 hover:shadow-blue-500/30 focus:outline-none focus:ring-4 focus:ring-blue-100"
        >
          Login
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        Need an account?
        <a href="teacherlogin.html" class="font-semibold text-blue-600 transition hover:text-blue-700">Contact admin</a>
      </p>
    </div>
  </div>
</body>
</html>
