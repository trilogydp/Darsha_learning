<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimuLab - Physics Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="min-h-full flex flex-col font-sans antialiased bg-slate-950 text-slate-100 p-4 sm:p-8">

  <div class="max-w-md mx-auto w-full mb-6 flex items-center justify-between">
    <a href="../index.html" class="text-xs font-semibold text-slate-400 hover:text-white flex items-center gap-2">
      <i class="fa-solid fa-arrow-left"></i> Back to Hub
    </a>
    <span class="text-xs font-mono text-blue-400 bg-blue-500/10 px-2.5 py-1 rounded-md border border-blue-500/20">Developer 2 Sandbox</span>
  </div>

  <main class="max-w-md mx-auto w-full flex-1 flex items-center justify-center">
    <div class="bg-slate-900 rounded-3xl border border-slate-800 p-8 shadow-2xl relative overflow-hidden w-full">
      <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl pointer-events-none"></div>
      
      <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-2xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-2xl mx-auto mb-4 border border-blue-500/20">
          <i class="fa-solid fa-atom"></i>
        </div>
        <h2 class="text-2xl font-bold text-white">Physics Login</h2>
        <p class="text-slate-400 text-sm mt-1">Enter your student credentials or quick join code</p>
      </div>

      <form onsubmit="event.preventDefault();" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Student ID or Email</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
              <i class="fa-solid fa-id-card"></i>
            </span>
            <input type="text" placeholder="e.g. S-10492 or student@school.edu" required class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Class Code</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
              <i class="fa-solid fa-key"></i>
            </span>
            <input type="text" placeholder="e.g. SIM-2026-X" required class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all font-mono uppercase">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" placeholder="••••••••" required class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
          </div>
        </div>

        <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2">
          <span>Sign In to Simulation</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="mt-6 text-center pt-6 border-t border-slate-800">
        <p class="text-xs text-slate-500">
          Are you an instructor? 
          <a href="teacherlogin.html" class="text-blue-400 hover:underline font-semibold ml-1">Go to Teacher Login</a>
        </p>
      </div>
    </div>
  </main>

</body>
</html>
