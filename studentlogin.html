<!DOCTYPE html>
<html lang="en" class="h-full bg-sky-100 text-slate-800">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimuLab - Student Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="min-h-full flex flex-col font-sans antialiased bg-sky-100 text-slate-800 p-4 sm:p-8">

  <div class="max-w-md mx-auto w-full mb-6 flex items-center justify-between relative z-10">
    <a href="../index.html" class="text-xs font-semibold text-slate-400 hover:text-indigo-300 flex items-center gap-2 transition-colors">
      <i class="fa-solid fa-arrow-left"></i> Back to Hub
    </a>
    <span class="text-xs font-mono text-indigo-300 bg-indigo-500/10 px-2.5 py-1 rounded-md border border-indigo-500/20">Physics Simulator</span>
  </div>

  <main class="max-w-md mx-auto w-full flex-1 flex items-center justify-center relative z-10">
    <div class="bg-white/90 backdrop-blur rounded-3xl border border-sky-300 p-8 shadow-2xl relative overflow-hidden w-full form-card">
      <div class="absolute top-0 right-0 w-40 h-40 bg-sky-200/70 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute bottom-0 left-0 w-32 h-32 bg-blue-100/80 rounded-full blur-3xl pointer-events-none"></div>
      
      <div class="text-center mb-8 relative z-10">
        <div class="w-16 h-16 rounded-2xl bg-sky-100 text-sky-600 flex items-center justify-center text-2xl mx-auto mb-4 border border-sky-300">
          <i class="fa-solid fa-atom"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800">Student Portal Login</h2>
        <p class="text-slate-600 text-sm mt-1">Enter your credentials to access physics simulations</p>
      </div>

      <form onsubmit="event.preventDefault();" class="space-y-5 relative z-10">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Student ID or Email</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-sky-600">
              <i class="fa-solid fa-id-card"></i>
            </span>
            <input type="text" placeholder="e.g. S-10492 or student@school.edu" required class="w-full pl-10 pr-4 py-3 bg-sky-50 border border-sky-200 rounded-xl text-sm text-slate-800 placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Class Code</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-sky-600">
              <i class="fa-solid fa-key"></i>
            </span>
            <input type="text" placeholder="e.g. SIM-2026-X" required class="w-full pl-10 pr-4 py-3 bg-sky-50 border border-sky-200 rounded-xl text-sm text-slate-800 placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all font-mono uppercase">
          </div>
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            required
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-base text-slate-800 placeholder-slate-400 transition-all duration-200 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-sky-600">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input id="student-password" type="password" placeholder="••••••••" required class="w-full pl-10 pr-12 py-3 bg-sky-50 border border-sky-200 rounded-xl text-sm text-slate-800 placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all">
            <button type="button" id="toggle-password" aria-label="Show password" class="absolute inset-y-0 right-0 px-3.5 flex items-center text-slate-500 hover:text-sky-600 transition-colors">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="w-full py-3.5 bg-sky-500 hover:bg-sky-600 text-white font-semibold rounded-xl transition-all shadow-lg shadow-sky-500/30 flex items-center justify-center gap-2">
          <span>Sign In to Simulation</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      <div class="mt-6 text-center pt-6 border-t border-sky-200">
        <p class="text-xs text-slate-600">
          Are you an instructor? 
          <a href="teacherlogin.html" class="text-blue-400 hover:underline font-semibold ml-1">Go to Teacher Login</a>
        </p>
      </div>
    </div>
  </main>

  <script>
    const passwordInput = document.getElementById('student-password');
    const togglePassword = document.getElementById('toggle-password');

    togglePassword.addEventListener('click', () => {
      const isPasswordHidden = passwordInput.type === 'password';
      passwordInput.type = isPasswordHidden ? 'text' : 'password';
      togglePassword.setAttribute('aria-label', isPasswordHidden ? 'Hide password' : 'Show password');
      togglePassword.innerHTML = `<i class="fa-solid fa-eye${isPasswordHidden ? '-slash' : ''}"></i>`;
    });
  </script>
</body>
</html>
